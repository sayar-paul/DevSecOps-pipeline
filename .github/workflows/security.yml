name: DevSecOps AI Security Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # GATE 1 - BANDIT SAST
  bandit-sast:
    name: Gate 1 - Bandit SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r . -ll --exclude .git

  # GATE 2 - SAFETY DEPENDENCY SCAN
  safety-scan:
    name: Gate 2 - Safety Dependency Scan
    runs-on: ubuntu-latest
    needs: bandit-sast
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety
        run: pip install safety

      - name: Scan dependencies
        run: safety check -r requirements.txt

  # GATE 3 - GITLEAKS SECRET DETECTION
  gitleaks-scan:
    name: Gate 3 - Gitleaks Secret Detection
    runs-on: ubuntu-latest
    needs: safety-scan
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GATE 4 - CUSTOM PROMPT INJECTION SCANNER
  prompt-injection-scan:
    name: Gate 4 - Custom Prompt Injection Scanner
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run custom injection scanner
        run: python inject_scanner.py
